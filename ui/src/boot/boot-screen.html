<script>
  // 启动画面：在脚本载入前按配置的主题着色。桌面窗口在地址里带上配置的主题；
  // 浏览器访问时沿用上次显示的主题。读取失败时的“重新加载”在界面脚本载入前也可用。
  ;(() => {
    const root = document.documentElement
    const params = new URLSearchParams(location.search)
    let theme = params.get('window_theme')
    if (theme === 'system') {
      theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
    }
    if (theme !== 'light' && theme !== 'dark') {
      try {
        theme = localStorage.getItem('mower-theme')
      } catch {
        theme = null
      }
    }
    root.dataset.mowerTheme = theme === 'dark' ? 'dark' : 'light'
    if (params.get('window_shell') === '1') root.dataset.mowerBootShell = ''
  })()
</script>

<script>
  ;(() => {
    const screen = document.getElementById('mower-boot')
    screen.querySelector('[data-boot-retry]').addEventListener('click', () => location.reload())
    // 入口模块下载失败时 Vue 尚未挂载，由静态页面显示重试按钮。
    function entryFailed(event) {
      if (!event.target?.matches?.('script[type="module"][src]')) return
      screen.querySelector('[data-boot-error]').textContent = '界面脚本加载失败，请重新加载。'
      screen.setAttribute('aria-busy', 'false')
      screen.classList.add('mower-boot--failed')
    }
    window.addEventListener('error', entryFailed, true)
    window.addEventListener('load', () => window.removeEventListener('error', entryFailed, true), {
      once: true
    })
  })()
</script>
