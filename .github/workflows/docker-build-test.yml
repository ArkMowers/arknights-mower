name: Test Docker Build and Runtime

on:
  pull_request:
    branches: [alpha]
    paths:
      - docker/Dockerfile
      - .github/workflows/docker-build-test.yml
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Optional Git ref to build and compare image sizes
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Test Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      BASELINE_REF: ${{ inputs.baseline_ref || github.event.pull_request.base.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and load the native image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: mower:runtime-smoke
          cache-from: type=gha,scope=mower-server-${{ matrix.arch }}
          cache-to: type=gha,scope=mower-server-${{ matrix.arch }},mode=max

      - name: Check packaged files and run Tiny OCR offline
        shell: bash
        run: |
          docker run --rm -i --network none --entrypoint python \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --mount "type=bind,src=$PWD/arknights_mower/tests/fixtures/mastery_panel_carnelian.png,dst=/fixture.png,readonly" \
            mower:runtime-smoke - <<'PY'
          from importlib.util import find_spec
          from pathlib import Path

          import cv2
          from arknights_mower.utils.rapidocr import create_engine

          assert not Path("/app/arknights_mower/tests").exists()
          model_dir = Path(find_spec("rapidocr").origin).parent / "models"
          for filename in ("PP-OCRv6_det_small.onnx", "PP-OCRv6_rec_small.onnx"):
              assert not (model_dir / filename).exists(), filename
          image = cv2.cvtColor(cv2.imread("/fixture.png"), cv2.COLOR_BGR2RGB)
          rows, _ = create_engine(threads=2)(image)
          assert rows and rows[0][1] == "[卡涅利安]沙缚镣锁", rows
          assert len(rows[0][0]) == 4, rows[0][0]
          PY

      - name: Start image and verify health endpoint
        shell: bash
        run: |
          set -euo pipefail

          maa_dir="${RUNNER_TEMP}/mower-maa-smoke"
          mkdir -p "${maa_dir}"
          touch "${maa_dir}/placeholder"

          container_id=$(docker run --detach \
            --env MOWER_TOKEN=runtime-smoke \
            --mount "type=bind,src=${maa_dir},dst=/MAA,readonly" \
            mower:runtime-smoke)

          # 清理逻辑直接写进 trap：用函数会被 shellcheck 判为不可达（不同版本分别
          # 报 SC2317 与 SC2329），压制码随版本变化，这里从写法上避免。
          trap 'docker logs "${container_id}" || true; docker rm --force "${container_id}" >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 60); do
            state=$(docker inspect --format '{{.State.Status}}' "${container_id}")
            health=$(docker inspect --format '{{.State.Health.Status}}' "${container_id}")

            if [ "${state}" != "running" ]; then
              echo "Container stopped before becoming healthy (state=${state})" >&2
              exit 1
            fi

            if [ "${health}" = "healthy" ]; then
              docker exec "${container_id}" \
                curl --fail --silent --header 'token: runtime-smoke' http://127.0.0.1:58000/status \
                | grep --quiet '"status"'
              exit 0
            fi

            if [ "${health}" = "unhealthy" ]; then
              echo "Container health check failed" >&2
              exit 1
            fi

            sleep 2
          done

          echo "Container did not become healthy within 120 seconds" >&2
          exit 1

      - name: Prepare comparison build
        if: env.BASELINE_REF != ''
        id: comparison
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 -- origin "$BASELINE_REF"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            context=.
            file="$RUNNER_TEMP/Dockerfile.comparison"
            base_file="$RUNNER_TEMP/Dockerfile.base"
            git show FETCH_HEAD:docker/Dockerfile > "$base_file"
            for source in docker/Dockerfile "$base_file"; do
              test "$(grep -Fxc 'FROM base AS runtime' "$source")" = 1
            done
            {
              sed '/^FROM base AS runtime$/,$d' docker/Dockerfile
              sed -n '/^FROM base AS runtime$/,$p' "$base_file"
            } > "$file"
            echo 'Compared the PR base runtime stage using the candidate source and build stages.' >> "$GITHUB_STEP_SUMMARY"
          else
            context="$RUNNER_TEMP/mower-comparison"
            git worktree add --detach "$context" FETCH_HEAD
            file="$context/docker/Dockerfile"
            echo 'Compared the complete manually selected revision.' >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "context=$context"
            echo "file=$file"
          } >> "$GITHUB_OUTPUT"

      - name: Build the comparison image on the same runner
        if: env.BASELINE_REF != ''
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.comparison.outputs.context }}
          file: ${{ steps.comparison.outputs.file }}
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: mower:baseline

      - name: Compare image sizes in bytes
        if: env.BASELINE_REF != ''
        shell: bash
        run: |
          {
            echo '| Revision | Image size (bytes) | gzip -1 docker save (bytes) |'
            echo '| --- | ---: | ---: |'
            for tag in baseline runtime-smoke; do
              image_bytes=$(docker image inspect --format '{{.Size}}' "mower:$tag")
              gzip_bytes=$(docker image save "mower:$tag" | gzip -n -1 | wc -c)
              printf '| %s | %s | %s |\n' "$tag" "$image_bytes" "$gzip_bytes"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
