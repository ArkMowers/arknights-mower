name: 通知 MowerRelease 同步开发版界面
on:
  push:
    branches: [alpha, main]
  workflow_dispatch:
permissions: {}
jobs:
  notify:
    if: github.repository == 'ArkMowers/arknights-mower'
    runs-on: ubuntu-latest
    steps:
      - name: 通知发布仓库同步本次提交
        env:
          GH_TOKEN: ${{ secrets.MOWER_RELEASE_TOKEN }}
        run: |
          gh api --method POST repos/ArkMowers/MowerRelease/dispatches \
            -f event_type=mower_frontend_revision -f "client_payload[revision]=$GITHUB_SHA"
