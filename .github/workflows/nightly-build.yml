name: Windows Nightly

on:
  schedule:
    # 02:00 Asia/Shanghai. GitHub runs schedules from the default branch.
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mower-windows-nightly
  cancel-in-progress: false

jobs:
  tag:
    name: Tag changed alpha commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.tag.outputs.changed }}
      tag_name: ${{ steps.tag.outputs.tag_name }}
      release_sha: ${{ steps.tag.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select alpha commit and publish nightly tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/alpha:refs/remotes/origin/alpha' --tags
          release_sha="$(git rev-parse refs/remotes/origin/alpha)"
          version="$(git show "$release_sha:arknights_mower/__init__.py" | sed -nE 's/^__version__ = "([0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+)"$/\1/p')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo '::error::alpha has no supported alpha version' >&2
            exit 1
          fi
          tag_name="v${version}.g${release_sha:0:8}"
          if git show-ref --verify --quiet "refs/tags/${tag_name}"; then
            if [[ "$(git rev-parse "refs/tags/${tag_name}^{commit}")" != "$release_sha" ]]; then
              echo "::error::nightly tag points to another commit: ${tag_name}" >&2
              exit 1
            fi
            if gh release view "$tag_name" --json assets --jq '.assets[].name' |
                 grep -q '_windows_x64.zip$'; then
              echo 'alpha has not changed since the last published nightly.'
              echo 'changed=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Retrying unpublished nightly ${tag_name}"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$tag_name" "$release_sha" -m "Windows nightly from alpha ${release_sha}"
            git push origin "refs/tags/${tag_name}"
          fi
          {
            echo 'changed=true'
            echo "tag_name=$tag_name"
            echo "release_sha=$release_sha"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish Windows nightly
    needs: tag
    if: ${{ needs.tag.outputs.changed == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release-build.yml
    with:
      tag_name: ${{ needs.tag.outputs.tag_name }}
      release_sha: ${{ needs.tag.outputs.release_sha }}
    secrets:
      MOWER_RELEASE_TOKEN: ${{ secrets.MOWER_RELEASE_TOKEN }}
